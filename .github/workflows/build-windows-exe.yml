# Builds "Fiery Hot Folder.exe", the "Mock Fiery.exe" test server and the Print Hub web application
# (Windows service package) on a GitHub Windows machine - nothing to install locally.
# GitHub → Actions → "Build Windows EXE" → Run workflow (choose the branch!) → download the
# "FieryHotFolder-windows", "MockFiery-windows" and "PrintHub-windows" artifacts when it finishes.
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar and exe
        shell: cmd
        run: |
          call mvn -q -B package || exit /b 1
          mkdir target\jpackage-input
          copy /y target\fiery-hotfolder-1.0.0-all.jar target\jpackage-input\
          jpackage --type app-image --name "Fiery Hot Folder" --app-version 1.0.0 --vendor "Chithira Printers" --icon assets\app.ico --input target\jpackage-input --main-jar fiery-hotfolder-1.0.0-all.jar --main-class com.chithira.fierydesk.App --java-options "-Xmx2g" --dest dist || exit /b 1
          copy /y fiery-hotfolder.properties "dist\Fiery Hot Folder\"

      - name: Build Mock Fiery exe (test server)
        shell: cmd
        run: |
          call mvn -q -B -f mock-fiery\pom.xml package || exit /b 1
          mkdir mock-fiery\target\jpackage-input
          copy /y mock-fiery\target\mock-fiery-1.0.0-all.jar mock-fiery\target\jpackage-input\
          jpackage --type app-image --name "Mock Fiery" --app-version 1.0.0 --vendor "Chithira Printers" --icon assets\mock.ico --win-console --input mock-fiery\target\jpackage-input --main-jar mock-fiery-1.0.0-all.jar --main-class com.chithira.mockfiery.MockFiery --dest dist || exit /b 1

      - name: Build Print Hub (web application) with its own Java
        shell: cmd
        run: |
          call mvn -q -B -f print-hub\pom.xml package || exit /b 1
          mkdir print-hub\target\jpackage-input
          copy /y print-hub\target\print-hub.jar print-hub\target\jpackage-input\
          jpackage --type app-image --name "Print Hub" --app-version 1.0.0 --vendor "Chithira Printers" --icon assets\app.ico --win-console --input print-hub\target\jpackage-input --main-jar print-hub.jar --main-class org.springframework.boot.loader.launch.JarLauncher --add-modules java.se,jdk.unsupported,jdk.crypto.ec,jdk.zipfs,jdk.management,jdk.naming.dns,jdk.localedata --dest dist || exit /b 1
          xcopy /e /i /y print-hub\packaging\windows "dist\Print Hub" || exit /b 1

      - name: Add the Windows service wrapper (WinSW 2.12.0)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" -OutFile "dist/Print Hub/PrintHubService.exe"
          if (-not (Test-Path "dist/Print Hub/runtime/bin/java.exe")) { throw "bundled Java missing" }
          if (-not (Test-Path "dist/Print Hub/app/print-hub.jar")) { throw "print-hub.jar missing" }

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Fiery Hot Folder" -DestinationPath FieryHotFolder-windows.zip
          Compress-Archive -Path "dist/Mock Fiery" -DestinationPath MockFiery-windows.zip
          Compress-Archive -Path "dist/Print Hub" -DestinationPath PrintHub-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FieryHotFolder-windows
          path: FieryHotFolder-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MockFiery-windows
          path: MockFiery-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PrintHub-windows
          path: PrintHub-windows.zip
