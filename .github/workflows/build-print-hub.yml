# Builds the Print Hub web application as a Windows service package (Java included, PostgreSQL separate)
# on a GitHub Windows machine.
# GitHub → Actions → "Build Print Hub" → Run workflow (choose the branch!) →
# download the "PrintHub-windows" artifact when it finishes. See print-hub/packaging/windows/README-WINDOWS.txt.
name: Build Print Hub

on:
  workflow_dispatch:
  push:
    tags: ["print-hub-v*"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: print-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: print-hub/pom.xml

      - name: Build Print Hub with its own Java
        shell: cmd
        run: |
          call mvn -q -B package || exit /b 1
          mkdir target\jpackage-input
          copy /y target\print-hub.jar target\jpackage-input\
          jpackage --type app-image --name "Print Hub" --app-version 1.0.0 --vendor "Chithira Printers" --icon assets\app.ico --win-console --input target\jpackage-input --main-jar print-hub.jar --main-class org.springframework.boot.loader.launch.JarLauncher --add-modules java.se,jdk.unsupported,jdk.crypto.ec,jdk.zipfs,jdk.management,jdk.naming.dns,jdk.localedata --dest dist || exit /b 1
          xcopy /e /i /y packaging\windows "dist\Print Hub" || exit /b 1

      - name: Add the Windows service wrapper (WinSW 2.12.0)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" -OutFile "dist/Print Hub/PrintHubService.exe"
          if (-not (Test-Path "dist/Print Hub/runtime/bin/java.exe")) { throw "bundled Java missing" }
          if (-not (Test-Path "dist/Print Hub/app/print-hub.jar")) { throw "print-hub.jar missing" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Print Hub" -DestinationPath PrintHub-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PrintHub-windows
          path: print-hub/PrintHub-windows.zip
