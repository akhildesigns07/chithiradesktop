# Builds "Mock Fiery.exe", the test server that behaves like a Fiery, on a GitHub Windows machine.
# GitHub → Actions → "Build Mock Fiery" → Run workflow (choose the branch!) →
# download the "MockFiery-windows" artifact when it finishes.
name: Build Mock Fiery

on:
  workflow_dispatch:
  push:
    tags: ["mock-fiery-v*"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mock-fiery
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mock-fiery/pom.xml

      - name: Build jar and exe
        shell: cmd
        run: |
          call mvn -q -B package || exit /b 1
          mkdir target\jpackage-input
          copy /y target\mock-fiery-1.0.0-all.jar target\jpackage-input\
          jpackage --type app-image --name "Mock Fiery" --app-version 1.0.0 --vendor "Chithira Printers" --icon assets\mock.ico --win-console --input target\jpackage-input --main-jar mock-fiery-1.0.0-all.jar --main-class com.chithira.mockfiery.MockFiery --dest dist || exit /b 1

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Mock Fiery" -DestinationPath MockFiery-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MockFiery-windows
          path: mock-fiery/MockFiery-windows.zip
