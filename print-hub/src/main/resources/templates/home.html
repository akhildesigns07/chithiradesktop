<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container-fluid px-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-3">Overview</h1>
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <a class="card stat text-decoration-none" th:href="@{/customers}">
                <div class="card-body"><div class="stat-label">Active customers</div>
                    <div class="stat-value" th:text="${customerCount}">0</div></div></a>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat"><div class="card-body"><div class="stat-label">Registered desktops</div>
                <div class="stat-value" th:text="${deviceCount}">0</div></div></div>
        </div>
    </div>
    <div class="alert alert-info">
        Print tracking (jobs from the desktops, Fiery status, printed &amp; waste counts) and the print, paper and
        waste dashboards arrive in the next phases.
    </div>
    <div th:if="${recent}">
        <h2 class="h5 mt-4">Latest activity</h2>
        <table class="table table-sm">
            <tr th:each="a : ${recent}">
                <td class="text-nowrap" th:text="${@fmt.dt(a.at)}"></td>
                <td th:text="${a.actorName}"></td>
                <td><span class="badge text-bg-light" th:text="${a.action}"></span></td>
                <td th:text="${a.summary}"></td>
            </tr>
        </table>
        <a th:href="@{/admin/audit}">Full audit log →</a>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
