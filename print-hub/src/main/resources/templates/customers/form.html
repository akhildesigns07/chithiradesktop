<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${c} ? 'Edit customer' : 'New customer')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width: 760px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-3" th:text="${c} ? 'Edit ' + ${c.code} + ' ' + ${c.name} : 'New customer'">Customer</h1>
    <form method="post" th:object="${form}"
          th:action="${c} ? @{/customers/{id}/edit(id=${c.id})} : @{/customers/new}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Name *</label>
                <input class="form-control" th:field="*{name}" th:errorclass="is-invalid" required autofocus>
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input class="form-control" th:field="*{phone}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{phone}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Company</label>
                <input class="form-control" th:field="*{company}">
            </div>
            <div class="col-md-6">
                <label class="form-label">GSTIN</label>
                <input class="form-control" th:field="*{gstin}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{gstin}"></div>
            </div>
            <div class="col-12">
                <label class="form-label">Address</label>
                <textarea class="form-control" rows="2" th:field="*{address}"></textarea>
            </div>
            <div class="col-12">
                <label class="form-label">Notes</label>
                <textarea class="form-control" rows="3" th:field="*{notes}"></textarea>
            </div>
        </div>
        <div class="mt-3 d-flex gap-2">
            <button class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" th:href="${c} ? @{/customers/{id}(id=${c.id})} : @{/customers}">Cancel</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
