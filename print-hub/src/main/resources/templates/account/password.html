<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width: 480px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h4">Change password</h1>
    <div class="alert alert-info" th:if="${forced}">You are using a temporary password. Choose your own to continue.</div>
    <form method="post" th:action="@{/account/password}">
        <div class="mb-3"><label class="form-label">Current password</label>
            <input class="form-control" type="password" name="current" required autocomplete="current-password"></div>
        <div class="mb-3"><label class="form-label">New password (at least 8 characters)</label>
            <input class="form-control" type="password" name="next" required minlength="8" autocomplete="new-password"></div>
        <div class="mb-3"><label class="form-label">New password again</label>
            <input class="form-control" type="password" name="confirm" required minlength="8" autocomplete="new-password"></div>
        <button class="btn btn-primary">Save</button>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
