<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${job.fileName})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container-fluid px-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <div class="small text-body-secondary">Print job #<span th:text="${job.id}"></span>
                <span th:if="${job.fieryJobId}"> · Fiery job <span th:text="${job.fieryJobId}"></span></span></div>
            <h1 class="h3 m-0"><span th:text="${job.fileName}"></span>
                <span th:replace="~{fragments/jobs :: status(${job})}"></span>
                <span class="badge text-bg-danger" th:if="${overdue}">counts overdue</span></h1>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/jobs}">All jobs</a>
    </div>

    <div class="row g-3">
        <div class="col-lg-5">
            <div class="card mb-3"><div class="card-body">
                <dl class="row mb-0">
                    <dt class="col-4">Customer</dt>
                    <dd class="col-8"><a th:if="${job.customer}" th:href="@{/customers/{id}(id=${job.customer.id})}"
                                         th:text="${job.customer.code} + ' ' + ${job.customer.name}"></a>
                        <span th:unless="${job.customer}">–</span></dd>
                    <dt class="col-4">Back side</dt><dd class="col-8" th:text="${job.backFileName} ?: '– (single-sided)'"></dd>
                    <dt class="col-4">Paper</dt>
                    <dd class="col-8"><span th:text="${job.paperName} ?: '–'"></span>
                        <span class="text-body-secondary small" th:if="${job.paperPcmid}" th:text="'[' + ${job.paperPcmid} + ']'"></span></dd>
                    <dt class="col-4">Sent</dt>
                    <dd class="col-8"><span th:text="${job.sheetsRequested}"></span> sheet(s)/copies
                        <span th:if="${job.duplex}">· two-sided</span>
                        <span th:if="${job.imposed}" th:text="'· imposed ' + ${job.piecesPerSheet} + '-up for ' + ${job.quantityPieces} + ' pieces'"></span></dd>
                    <dt class="col-4">Method</dt><dd class="col-8" th:text="${job.sendMethod}"></dd>
                    <dt class="col-4">Instructions</dt><dd class="col-8" style="white-space: pre-line" th:text="${job.instructions} ?: '–'"></dd>
                    <dt class="col-4">From</dt>
                    <dd class="col-8"><span th:text="${job.device.name}"></span>
                        <span th:if="${job.operator}" th:text="'(' + ${job.operator} + ')'"></span>,
                        <span th:text="${@fmt.dt(job.sentAt)}"></span></dd>
                    <dt class="col-4" th:if="${job.errorMessage}">Error</dt>
                    <dd class="col-8 text-danger" th:if="${job.errorMessage}" th:text="${job.errorMessage}"></dd>
                </dl>
            </div></div>

            <div class="card mb-3"><div class="card-body">
                <h2 class="h6">Printed &amp; waste</h2>
                <div th:if="${job.printedCount != null}" class="mb-2">
                    <span class="fs-4 fw-semibold" th:text="${job.printedCount}"></span> printed ·
                    <span class="fs-4 fw-semibold" th:classappend="${job.wasteCount > 0} ? 'text-danger' : ''" th:text="${job.wasteCount}"></span> waste
                    <span class="text-body-secondary" th:if="${job.wasteReason}" th:text="'(' + ${job.wasteReason} + ')'"></span>
                    <div class="small text-body-secondary">by <span th:text="${job.countedBy}"></span>,
                        <span th:text="${@fmt.dt(job.countedAt)}"></span></div>
                </div>
                <div th:if="${job.printedCount == null and !canCount}" class="text-body-secondary small">
                    Not counted yet. Counts are entered by the print room once the job has printed.</div>
                <div th:if="${canCount}"
                     th:replace="~{fragments/jobs :: countsForm(@{/jobs/{id}/counts(id=${job.id})}, ${job}, ${counts}, ${wasteReasons}, false)}"></div>
            </div></div>

            <div class="card" th:if="${canCancel}"><div class="card-body">
                <h2 class="h6">Cancel job</h2>
                <form method="post" th:action="@{/jobs/{id}/cancel(id=${job.id})}" class="d-flex gap-2"
                      onsubmit="return confirm('Cancel this job? It will not be counted.')">
                    <input class="form-control form-control-sm" name="reason" placeholder="Why (e.g. customer cancelled)" required>
                    <button class="btn btn-sm btn-outline-danger">Cancel job</button>
                </form>
            </div></div>
        </div>

        <div class="col-lg-7">
            <h2 class="h6">Timeline</h2>
            <ol class="list-group list-group-numbered mb-4">
                <li class="list-group-item d-flex justify-content-between align-items-start" th:each="h : ${history}">
                    <div class="ms-2 me-auto">
                        <div class="fw-semibold"><span th:if="${h.fromStatus}" th:text="${h.fromStatus.label()} + ' → '"></span>
                            <span th:text="${h.toStatus.label()}"></span></div>
                        <span class="small text-body-secondary" th:text="${h.note}"></span>
                    </div>
                    <span class="small text-nowrap"><span th:text="${@fmt.dt(h.at)}"></span>
                        <span class="badge text-bg-light" th:text="${h.source}"></span></span>
                </li>
            </ol>
            <h2 class="h6">Audit</h2>
            <table class="table table-sm">
                <tr th:each="a : ${audit}">
                    <td class="small text-nowrap" th:text="${@fmt.dt(a.at)}"></td>
                    <td class="small" th:text="${a.actorName}"></td>
                    <td><span class="badge text-bg-secondary" th:text="${a.action}"></span></td>
                    <td class="small" th:text="${a.summary}"></td>
                </tr>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
