<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Paper dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container-fluid px-4 pb-4" th:with="t=${data.totals}">
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-2">Paper dashboard</h1>
        <a class="small" th:if="${@access.canView('PAPERS')}" th:href="@{/papers}">Paper catalog →</a>
    </div>
    <div th:replace="~{fragments/dashboard :: filters}"></div>

    <div class="row g-3 mb-3">
        <div class="col-6 col-lg-3"><div th:replace="~{fragments/dashboard :: tile('Papers used', ${data.byPaper.size()}, 'in this range')}"></div></div>
        <div class="col-6 col-lg-3"><div th:replace="~{fragments/dashboard :: tile('Sheets used', ${#numbers.formatInteger(t.printed + t.waste, 1, 'COMMA')}, 'printed + waste')}"></div></div>
        <div class="col-6 col-lg-3"><div th:replace="~{fragments/dashboard :: tile('Waste %', ${#numbers.formatDecimal(t.wastePercent(), 1, 1)} + ' %', ${#numbers.formatInteger(t.waste, 1, 'COMMA')} + ' waste sheets')}"></div></div>
        <div class="col-6 col-lg-3"><div th:replace="~{fragments/dashboard :: tile('Most used', ${data.byPaper.empty} ? '–' : ${data.byPaper[0].label}, ${data.byPaper.empty} ? '' : ${#numbers.formatInteger(data.byPaper[0].printed, 1, 'COMMA')} + ' printed')}"></div></div>
    </div>

    <div class="row g-3">
        <div class="col-12 col-xl-6"><div class="card chart-card h-100"><div class="card-body">
            <h2>Printed and waste sheets per paper</h2>
            <div class="chart-note mb-2">Top 10 by printed sheets – click a paper in the table to see it alone</div>
            <div th:replace="~{fragments/dashboard :: canvas('papers', 'Printed and waste sheets per paper', true)}"></div>
            <div th:replace="~{fragments/dashboard :: groupTable(${data.byPaper}, '/dashboards/papers', 'paper')}"></div>
        </div></div></div>
        <div class="col-12 col-xl-6"><div class="card chart-card h-100"><div class="card-body">
            <h2>Waste % per paper</h2>
            <div class="chart-note mb-2">Highest first; papers with counted sheets only</div>
            <div th:replace="~{fragments/dashboard :: canvas('wastePercent', 'Waste percent per paper', true)}"></div>
        </div></div></div>
        <div class="col-12"><div class="card chart-card"><div class="card-body">
            <h2 th:text="${filter.paperPcmid} ? 'Sheets per day – this paper' : 'Sheets per day – all papers'">Sheets per day</h2>
            <div class="chart-note mb-2">Printed and waste, counted jobs only</div>
            <div th:replace="~{fragments/dashboard :: canvas('daily', 'Printed and waste sheets per day', false)}"></div>
            <div th:replace="~{fragments/dashboard :: dailyTable(${data.days})}"></div>
        </div></div></div>
    </div>
    <p th:replace="~{fragments/dashboard :: countingNote}"></p>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout :: chartScripts}"></th:block>
</body>
</html>
